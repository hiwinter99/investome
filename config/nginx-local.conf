# Local coin API experiment only. Run with the project work/nginx-local prefix.
worker_processes 1;
pid nginx.pid;
error_log error.log;

events {
    worker_connections 256;
}

http {
    access_log access.log;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;

    upstream spring_coin_servers {
        server 127.0.0.1:18081;
        server 127.0.0.1:18082;
    }

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        location = /api/crypto-top30 {
            proxy_pass http://spring_coin_servers;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            add_header X-Backend $upstream_addr always;
        }

        # Other routes are deliberately excluded: the preview DBs are separate.
        location / {
            return 404;
        }
    }
}
